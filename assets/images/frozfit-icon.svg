<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <circle cx="512" cy="512" r="440" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Snowflake: 3 axis × 2 arms = 6 arms, using rotate transforms -->
  <g transform="translate(512,512)" filter="url(#glow)">
    <g stroke="white" fill="none" stroke-linecap="round">

      <!-- Axis 0° (vertical) -->
      <g transform="rotate(0)">
        <line x1="0" y1="-290" x2="0" y2="290" stroke-width="52"/>
        <!-- Outer branches at ±187 (2/3 of 290) -->
        <line x1="0" y1="-187" x2="-86" y2="-230" stroke-width="34"/>
        <line x1="0" y1="-187" x2="86" y2="-230" stroke-width="34"/>
        <line x1="0" y1="187" x2="-86" y2="230" stroke-width="34"/>
        <line x1="0" y1="187" x2="86" y2="230" stroke-width="34"/>
        <!-- Inner branches at ±97 (1/3 of 290) -->
        <line x1="0" y1="-97" x2="-54" y2="-124" stroke-width="26"/>
        <line x1="0" y1="-97" x2="54" y2="-124" stroke-width="26"/>
        <line x1="0" y1="97" x2="-54" y2="124" stroke-width="26"/>
        <line x1="0" y1="97" x2="54" y2="124" stroke-width="26"/>
      </g>

      <!-- Axis 60° -->
      <g transform="rotate(60)">
        <line x1="0" y1="-290" x2="0" y2="290" stroke-width="52"/>
        <line x1="0" y1="-187" x2="-86" y2="-230" stroke-width="34"/>
        <line x1="0" y1="-187" x2="86" y2="-230" stroke-width="34"/>
        <line x1="0" y1="187" x2="-86" y2="230" stroke-width="34"/>
        <line x1="0" y1="187" x2="86" y2="230" stroke-width="34"/>
        <line x1="0" y1="-97" x2="-54" y2="-124" stroke-width="26"/>
        <line x1="0" y1="-97" x2="54" y2="-124" stroke-width="26"/>
        <line x1="0" y1="97" x2="-54" y2="124" stroke-width="26"/>
        <line x1="0" y1="97" x2="54" y2="124" stroke-width="26"/>
      </g>

      <!-- Axis 120° -->
      <g transform="rotate(120)">
        <line x1="0" y1="-290" x2="0" y2="290" stroke-width="52"/>
        <line x1="0" y1="-187" x2="-86" y2="-230" stroke-width="34"/>
        <line x1="0" y1="-187" x2="86" y2="-230" stroke-width="34"/>
        <line x1="0" y1="187" x2="-86" y2="230" stroke-width="34"/>
        <line x1="0" y1="187" x2="86" y2="230" stroke-width="34"/>
        <line x1="0" y1="-97" x2="-54" y2="-124" stroke-width="26"/>
        <line x1="0" y1="-97" x2="54" y2="-124" stroke-width="26"/>
        <line x1="0" y1="97" x2="-54" y2="124" stroke-width="26"/>
        <line x1="0" y1="97" x2="54" y2="124" stroke-width="26"/>
      </g>

    </g>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="56" fill="white"/>
  </g>
</svg>
